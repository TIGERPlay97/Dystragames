<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Básico -->
    <title>Dystra Games</title>
    <meta name="description" content="Sitio oficial de Dystra Games. Estudio enfocado en el desarrollo de videojuegos de aventura y mundo abierto.">
    <meta name="keywords" content="Dystra Games, desarrollo de videojuegos, juegos, Unity, SOK">
    <meta name="author" content="Dystra Games">
    
    <!-- Framework Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado / Navegación (Alineado completo a los extremos) -->
    <header class="border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="w-full px-8 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-black tracking-wider bg-gradient-to-r from-indigo-400 via-purple-400 to-indigo-300 bg-clip-text text-transparent hover:opacity-90 transition-opacity">
                DYSTRA GAMES
            </a>
            <nav class="space-x-8 text-sm font-medium text-slate-300">
                <a href="#inicio" class="hover:text-indigo-400 transition-colors">Inicio</a>
                <a href="#proyectos" class="hover:text-indigo-400 transition-colors">Proyectos</a>
                <a href="#contacto" class="hover:text-indigo-400 transition-colors">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- Sección Principal (Hero) -->
    <main id="inicio" class="w-full max-w-6xl mx-auto px-6 py-16 flex-grow flex flex-col justify-center items-center">
        
        <p class="text-lg sm:text-xl text-slate-300 max-w-2xl text-center mb-12 leading-relaxed font-light">
            Bienvenido a la página oficial de <strong class="text-white font-semibold">Dystra Games</strong>. Nos dedicamos al diseño y desarrollo de videojuegos.
        </p>

        <!-- Sección de Proyectos -->
        <section id="proyectos" class="w-full">
            <div class="flex items-center justify-between mb-8 border-b border-slate-800 pb-4">
                <h2 class="text-xl font-bold tracking-tight text-white">PROYECTOS DESTACADOS</h2>
                <span class="text-xs font-mono text-slate-500 uppercase">Catálogo de títulos</span>
            </div>

            <!-- Contenedor donde JavaScript insertará las tarjetas automáticamente -->
            <div id="contenedor-proyectos" class="flex flex-col gap-8 w-full">
                <!-- Se genera dinámicamente con JS -->
            </div>
        </section>
    </main>

    <!-- Pie de página Estilo Estudio Profesional -->
    <footer id="contacto" class="border-t border-slate-800/80 bg-slate-900/40 py-10 mt-16">
        <div class="w-full px-8 flex flex-col md:flex-row justify-between items-center text-slate-500 text-xs gap-6">
            
            <div class="flex flex-col gap-2 text-left">
                <span class="font-bold tracking-wider text-slate-400">DYSTRA GAMES STUDIO</span>
                <p>© 2026 Dystra Games. Todos los derechos reservados.</p>
            </div>

            <nav class="flex space-x-6 text-slate-400 font-medium">
                <a href="#inicio" class="hover:text-indigo-400 transition-colors">Inicio</a>
                <a href="#proyectos" class="hover:text-indigo-400 transition-colors">Juegos</a>
                <a href="#contacto" class="hover:text-indigo-400 transition-colors">Contacto</a>
            </nav>

            <div class="text-right text-slate-500 font-mono text-xs">
                <span>Official Site</span>
            </div>
        </div>
    </footer>

    <!-- Lógica de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
