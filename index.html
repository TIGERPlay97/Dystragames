<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Básico -->
    <title>Dystra Games</title>
    <meta name="description" content="Sitio oficial de Dystra Games. Estudio enfocado en el desarrollo de videojuegos de aventura y mundo abierto.">
    <meta name="keywords" content="Dystra Games, desarrollo de videojuegos, juegos, Unity, SOK">
    <meta name="author" content="Dystra Games">
    <meta name="theme-color" content="#05080f">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://dystragames.com/">

    <!-- Icono de la pestaña -->
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph (al compartir en redes y mensajería) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dystra Games">
    <meta property="og:title" content="Dystra Games">
    <meta property="og:description" content="Sitio oficial de Dystra Games. Estudio enfocado en el desarrollo de videojuegos de aventura y mundo abierto.">
    <meta property="og:url" content="https://dystragames.com/">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dystra Games">
    <meta name="twitter:description" content="Sitio oficial de Dystra Games. Estudio enfocado en el desarrollo de videojuegos de aventura y mundo abierto.">

    <!-- Datos estructurados: le dicen a Google que Dystra Games es una organización -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dystra Games",
        "url": "https://dystragames.com/",
        "logo": "https://dystragames.com/favicon.png",
        "description": "Estudio de desarrollo de videojuegos de aventura y mundo abierto."
    }
    </script>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body data-pagina="inicio">

    <!-- Header, overlay y menú lateral: los inserta script.js -->
    <div id="layout-header"></div>

    <main>
        <!-- Sección Principal (Hero) -->
        <section id="inicio" class="hero">
            <!-- Espacio reservado para imagen o video de fondo -->
            <div class="hero-media"></div>

            <div class="hero-content">
                <h1 class="hero-title">Dystra Games</h1>
                <p class="hero-description">
                    Bienvenido a la página oficial de <strong>Dystra Games</strong>. Nos dedicamos al diseño y desarrollo de videojuegos.
                </p>
            </div>
        </section>

        <!-- Sección de Proyectos -->
        <section id="proyectos" class="section-container">
            <div class="section-header">
                <h2>Proyectos destacados</h2>
                <span>Catálogo de títulos</span>
            </div>

            <!-- Contenedor donde JavaScript insertará las tarjetas -->
            <div id="contenedor-proyectos" class="projects-list">
                <!-- Generado dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Pie de página: lo inserta script.js -->
    <div id="layout-footer"></div>

    <!-- Lógica de JavaScript -->
    <script src="/datos/proyectos.js"></script>
    <script src="/script.js"></script>
</body>
</html>
